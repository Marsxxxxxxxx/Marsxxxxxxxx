name: Update language bar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # Daily at 08:17 Asia/Shanghai (GitHub scheduling can be delayed).
  push:
    paths:
      - '.github/workflows/languages.yml'
      - 'scripts/languages.mjs'
      - 'README.md'

# This write permission belongs to the profile repository's GITHUB_TOKEN.
# LANGUAGE_STATS_TOKEN only needs Metadata: Read for repository metadata.
permissions:
  contents: write

concurrency:
  group: language-bar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate language bars
        env:
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN || secrets.PRIVATE_STATS_TOKEN }}
          STATS_OWNER: ${{ github.repository_owner }}
          STATS_REPOSITORY: ${{ github.repository }}
          STATS_REF: ${{ github.ref_name }}
        run: node scripts/languages.mjs

      - name: Commit updated bars and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets README.md scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'Language shares and README image versions are unchanged.'
          else
            git commit -m 'Update repository language bar'
            git push
          fi
